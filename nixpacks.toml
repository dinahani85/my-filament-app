[phases.setup]
# Keep "..." — it preserves the packages Nixpacks' own PHP/Node providers add
# (php + php-fpm, composer, nginx, node). Listing php/mbstring/opcache
# explicitly on top of those collides in the nix profile: nixpkgs' PHP already
# ships mbstring.so and opcache.so at the same paths.
nixPkgs = ["...", "php83Extensions.redis", "python311Packages.supervisor", "python311", "ffmpeg"]

[phases.build]
cmds = [
    "mkdir -p /etc/supervisor/conf.d/",
    "mkdir -p /run",
    "mkdir -p /var/log",
    "cp /assets/worker-*.conf /etc/supervisor/conf.d/",
    "cp /assets/supervisord.conf /etc/supervisord.conf",
    "cp /assets/php-fpm.conf /etc/php-fpm.conf",
    "chmod +x /assets/start.sh",

    # Create storage directories with proper permissions
    "mkdir -p /app/storage/logs",
    "mkdir -p /app/storage/framework/cache",
    "mkdir -p /app/storage/framework/sessions",
    "mkdir -p /app/storage/framework/views",
    "chmod -R 775 /app/storage",
    "chown -R www-data:www-data /app/storage /var/log",

    # Install yt-dlp binary
    "curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp && chmod +x /usr/local/bin/yt-dlp"
]

[start]
cmd = '/assets/start.sh'

[healthcheck]
cmd = 'wget --quiet --tries=1 --spider "http://127.0.0.1:${PORT:-80}/nginx-health" || exit 1'
interval = '10s'
timeout = '5s'
retries = 3
startPeriod = '30s'

[staticAssets]
"start.sh" = '''
#!/bin/bash

# Transform the nginx configuration
node /assets/scripts/prestart.mjs /assets/nginx.template.conf /etc/nginx.conf

# Ensure directories exist with correct permissions at runtime
mkdir -p /run
mkdir -p /var/log
mkdir -p /app/storage/logs
mkdir -p /app/storage/framework/cache
mkdir -p /app/storage/framework/sessions
mkdir -p /app/storage/framework/views
chmod -R 775 /app/storage
touch /app/storage/logs/laravel.log
chmod 664 /app/storage/logs/laravel.log
chown -R www-data:www-data /var/log /app/storage

# Ensure Traefik dynamic config directory is writable by PHP-FPM (www-data).
if [ -d "/traefik-dynamic" ]; then
    chown www-data:www-data /traefik-dynamic
    chmod 755 /traefik-dynamic
    chown www-data:www-data /traefik-dynamic/tafra-*.yaml 2>/dev/null || true
fi

# Load Redis extension
REDIS_PATH=$(find /nix/store -name "redis.so" | head -n 1)
INI_SCAN_DIR=$(php -r "echo PHP_CONFIG_FILE_SCAN_DIR;" 2>/dev/null)

if [ -n "$INI_SCAN_DIR" ] && [ -d "$INI_SCAN_DIR" ]; then
    echo "extension=$REDIS_PATH" > "$INI_SCAN_DIR/redis.ini"
    rm -f "$INI_SCAN_DIR/mbstring.ini" 2>/dev/null || true
    echo "Redis extension configured in $INI_SCAN_DIR" > /var/log/extensions-config.log
else
    echo "WARNING: Could not find PHP ini scan dir, searching nix store for php-with-extensions" > /var/log/extensions-config.log
    PHP_EXT_DIR=$(find /nix/store -maxdepth 1 -type d -name "*php-with-extensions*" | head -n 1)
    if [ -n "$PHP_EXT_DIR" ]; then
        mkdir -p "$PHP_EXT_DIR/lib" 2>/dev/null || true
        echo "extension=$REDIS_PATH" > "$PHP_EXT_DIR/lib/redis.ini" 2>/dev/null || true
        rm -f "$PHP_EXT_DIR/lib/mbstring.ini" 2>/dev/null || true
        INI_SCAN_DIR="$PHP_EXT_DIR/lib"
    fi
fi

# OPcache setup
if [ -n "$INI_SCAN_DIR" ] && [ -d "$INI_SCAN_DIR" ]; then
    cp /assets/php-performance.ini "$INI_SCAN_DIR/zz-performance.ini"

    if ! php -r 'exit(extension_loaded("Zend OPcache") ? 0 : 1);' 2>/dev/null; then
        OPCACHE_PATH=$(find /nix/store -name "opcache.so" | head -n 1)
        if [ -n "$OPCACHE_PATH" ]; then
            sed -i "1i zend_extension=$OPCACHE_PATH" "$INI_SCAN_DIR/zz-performance.ini"
        fi
    fi
fi

mkdir -p /tmp/opcache
chmod 1777 /tmp/opcache

# Run Central migrations
cd /app && php artisan migrate --force --path=database/migrations 2>&1 | tee /var/log/migration.log || true

# Publish assets & cache setup
cd /app && php artisan vendor:publish --tag=livewire:assets --force 2>&1 || true
cd /app && php artisan filament:assets 2>&1 || true

cd /app && php artisan config:clear 2>&1 || true
cd /app && php artisan route:clear 2>&1 || true
cd /app && php artisan config:cache 2>&1 || true
cd /app && php artisan route:cache 2>&1 || true
cd /app && php artisan view:cache 2>&1 || true

# Start supervisor
supervisord -c /etc/supervisord.conf -n
'''

"supervisord.conf" = '''
[unix_http_server]
file=/assets/supervisor.sock

[supervisord]
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/assets/supervisord.pid
nodaemon=false
silent=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///assets/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
'''

"worker-nginx.conf" = '''
[program:worker-nginx]
process_name=%(program_name)s_%(process_num)02d
command=nginx -c /etc/nginx.conf
autostart=true
autorestart=true
stdout_logfile=/var/log/worker-nginx.log
stderr_logfile=/var/log/worker-nginx.log
'''

"worker-phpfpm.conf" = '''
[program:worker-phpfpm]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'REDIS_PATH=$(find /nix/store -name "redis.so" | head -n 1); php-fpm -y /etc/php-fpm.conf -d "extension=$REDIS_PATH" -F'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/worker-phpfpm.log
stderr_logfile=/var/log/worker-phpfpm.log
'''

"worker-laravel.conf" = '''
[program:worker-laravel]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --max-jobs=500 --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=4
startsecs=0
stopwaitsecs=3600
stdout_logfile=/var/log/worker-laravel.log
stderr_logfile=/var/log/worker-laravel.log
'''

"worker-scheduler.conf" = '''
[program:worker-scheduler]
process_name=%(program_name)s
command=php /app/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
startsecs=0
stdout_logfile=/var/log/worker-scheduler.log
stderr_logfile=/var/log/worker-scheduler.log
'''

"php-fpm.conf" = '''
[global]
pid = /run/php-fpm.pid
error_log = /var/log/php-fpm.log
daemonize = no

[www]
listen = 127.0.0.1:9000
user = www-data
group = www-data
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
clear_env = no

php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 100M
php_admin_value[post_max_size] = 110M
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300

php_admin_value[error_log] = /var/log/php-fpm.error.log
php_admin_value[sys_temp_dir] = /tmp
php_admin_value[session.save_handler] = files
php_admin_value[session.save_path] = /tmp
'''

"php-performance.ini" = '''
opcache.enable=1
opcache.memory_consumption=384
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=32531
opcache.validate_timestamps=1
opcache.revalidate_freq=60
opcache.save_comments=1
opcache.enable_cli=1
opcache.file_cache=/tmp/opcache
opcache.file_cache_fallback=1

realpath_cache_size=4096k
realpath_cache_ttl=600
'''

"nginx.template.conf" = '''
user www-data www-data;
worker_processes auto;
daemon off;

worker_rlimit_nofile 8192;

events {
  worker_connections  4096;
}

http {
    include    $!{nginx}/conf/mime.types;
    index    index.html index.htm index.php;

    default_type application/octet-stream;
    log_format   main '$remote_addr - $remote_user [$time_local]  $status '
        '"$request" $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx-access.log;
    error_log /var/log/nginx-error.log;
    sendfile     on;
    tcp_nopush   on;
    server_names_hash_bucket_size 128;

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;

        $if(NIXPACKS_PHP_ROOT_DIR) (
            root ${NIXPACKS_PHP_ROOT_DIR};
        ) else (
            root /app/public;
        )

        add_header X-Content-Type-Options "nosniff";
        client_max_body_size 110M;
        client_body_timeout 600;
        send_timeout 600;
        proxy_read_timeout 600;
        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
            fastcgi_intercept_errors on;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
            fastcgi_read_timeout 600;
            fastcgi_send_timeout 600;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
'''